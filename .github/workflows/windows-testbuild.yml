name: Windows Test Build

# Baut einen installierbaren Windows-Setup (.exe / NSIS) aus dem aktuellen
# Stand und hängt ihn als GitHub-Release (Prerelease) an DIESES Repo. Ein
# Fallback-Artefakt am Workflow-Run stellt sicher, dass die .exe auch dann
# abrufbar ist, wenn der Release-Schritt scheitert.
#
# Auslöser:
#   - Push auf den Feature-Branch, ABER nur wenn die Commit-Message den Marker
#     `[win-build]` enthält (sonst würde jeder Commit einen 10-Min-Windows-Build
#     starten). Der Job wird sonst übersprungen (quasi kostenlos).
#   - manuell (workflow_dispatch).
#
# Warum Push-Trigger statt Tag: die Remote-Proxy dieser Umgebung erlaubt nur
# Pushes auf den Feature-Branch, keine Tags. Das Tag/Release wird deshalb
# serverseitig von softprops/action-gh-release über die API angelegt
# (GITHUB_TOKEN, contents: write) — das umgeht die Proxy-Beschränkung.
#
# electron-builder läuft mit `--publish never`: die publish-Config in
# package.json zeigt auf ein separates Repo (Synthstudio-releases), das das
# Auto-Token nicht erreicht. Das Release entsteht stattdessen auf diesem Repo.

on:
  push:
    branches:
      - claude/electribe-2-sampler-research-8iepia
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Setup (NSIS x64)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[win-build]')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: pnpm einrichten
        uses: pnpm/action-setup@v4

      - name: Dependencies installieren
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript-Check (App)
        run: pnpm check

      - name: Electron kompilieren (tsc → CJS + Bundles)
        run: pnpm compile:electron

      - name: React-App bauen (Vite)
        run: pnpm exec vite build

      - name: Staging vorbereiten (No-Op seit v1.0.5)
        run: node scripts/prepare-electron-build.cjs

      - name: Windows-Setup bauen (NSIS, unsigniert, kein Publish)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx --yes electron-builder --win nsis --publish never

      - name: Version auslesen
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Setup-Artefakt sichern (Fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Synthstudio-Windows-Setup
          path: |
            release/**/*.exe
            release/**/*.exe.blockmap
            release/**/latest.yml
          retention-days: 14
          if-no-files-found: warn

      - name: GitHub-Release (Prerelease) veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: winbuild-${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: "Synthstudio ${{ steps.ver.outputs.version }} (Windows Test Build)"
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            release/**/*.exe
          body: |
            Automatischer Windows-Test-Build (NSIS-Installer, x64, **unsigniert**)
            aus dem Feature-Branch `claude/electribe-2-sampler-research-8iepia`.

            Enthält den kompletten Korg-E2/E2S-Stand: nativer SysEx-Layer (0x42),
            `.esx`-Import (Audio + Sequencer), `.all`-Bank-Editor mit Tune/Level/
            Loop/Trim/Stereo→Mono/Move/Merge-Import, WAV-Export mit smpl/cue-Chunks,
            In-Bank-Sample-Rename und die Real-File-Regressions-Harness.

            ⚠️ Unsigniert → Windows SmartScreen zeigt beim ersten Start eine
            Warnung ("Weitere Informationen" → "Trotzdem ausführen").
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Electron Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (z.B. 1.0.0)"
        required: false
        default: ""

permissions:
  contents: write  # für electron-builder GitHub Release-Upload

jobs:
  test:
    name: Pre-Release Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --no-frozen-lockfile
      - name: TypeScript check
        run: pnpm check
      - name: Vitest Unit-Tests
        run: pnpm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-14   # Apple Silicon — cross-builds beide archs in einem Lauf
            platform: mac

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: pnpm einrichten
        uses: pnpm/action-setup@v4
        # Version kommt aus dem "packageManager"-Feld in package.json

      - name: Version übernehmen (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version='${{ inputs.version }}'; fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"

      - name: Dependencies installieren
        run: pnpm install --no-frozen-lockfile   # ← kein frozen-lockfile

      - name: TypeScript kompilieren (Electron)
        run: pnpm exec tsc --project tsconfig.electron.json

      - name: JS zu CJS umbenennen
        run: node scripts/rename-to-cjs.cjs

      - name: collab-server bündeln
        run: pnpm exec esbuild electron/collab-server.ts --bundle --platform=node --format=cjs --external:bufferutil --external:utf-8-validate --outfile=electron-dist/collab-server.cjs

      - name: updater bündeln
        run: pnpm exec esbuild electron/updater.ts --bundle --platform=node --format=cjs --external:electron --outfile=electron-dist/updater.cjs

      - name: React-App bauen (Vite)
        run: pnpm exec vite build

      - name: Staging vorbereiten
        run: node scripts/prepare-electron-build.cjs

      - name: Electron-App bauen (Linux)
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: npx --yes electron-builder --linux AppImage deb --publish always   # ← npx statt pnpm exec

      - name: Electron-App bauen (Windows)
        if: matrix.platform == 'windows'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx --yes electron-builder --win nsis --publish always

      - name: Electron-App bauen (macOS Intel + Apple Silicon)
        if: matrix.platform == 'mac'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx --yes electron-builder --mac dmg zip --x64 --arm64 --publish always

      - name: Build-Artefakte sichern
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.platform }}
          path: |
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.exe
            release/**/*.dmg
            release/**/*.zip
            release/**/*.yml
          retention-days: 7
